<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated QR Code</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }
        .data-display {
            color: #4b5563;
            font-size: 0.95rem;
            word-break: break-all;
            background: #f9fafb;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 1.5rem;
            max-height: 100px;
            overflow-y: auto;
        }
        .qr-img {
            display: block;
            width: min(85vw, 300px);
            height: auto;
            margin: 0 auto 1.5rem auto;
            image-rendering: pixelated;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            padding: 0.5rem;
            background: #ffffff;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 0.85rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-secondary:hover {
            background-color: #e5e7eb;
        }
        .btn:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Your QR Code</h1>
        <div class="data-display">{{ data }}</div>
        <img
            class="qr-img"
            src="static/qrcode.png"
            alt="QR code for {{ data }}"
            >
        <div class="btn-group">
            <a class="btn btn-primary" href="static/qrcode.png" download="qrcode.png">Download QR Code</a>
            <a class="btn btn-secondary" href="/">Generate Another QR Code</a>
        </div>
    </div>
</body>
</html>
